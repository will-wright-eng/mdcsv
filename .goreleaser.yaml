version: 2

project_name: mdcsv

before:
  hooks:
    - go test ./...

builds:
  - main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Breaking changes
      regexp: '^.*?(feat|fix|refactor)(\([[:word:]]+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs'
      - '^test'
      - '^chore'
      - '^ci'

release:
  github:
    owner: will-wright-eng
    name: mdcsv
  footer: >-
    **Full Changelog**: https://github.com/will-wright-eng/mdcsv/compare/{{ .PreviousTag }}...{{ .Tag }}
